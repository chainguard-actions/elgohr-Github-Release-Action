name: Test release with explicit tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install mock gh CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "gh $*" >> /tmp/gh-calls.log\necho "gh called with: $*"\nexit 0\n' > "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          title: "Test Explicit Tag Release"
          tag: "test-explicit-tag-v1.2.3"

      - name: Assert gh release create was called with explicit tag
        run: |
          echo "=== gh calls log ==="
          cat /tmp/gh-calls.log || echo "(no log file)"
          echo "===================="
          if [ ! -f /tmp/gh-calls.log ]; then
            echo "FAIL: gh was never called"
            exit 1
          fi
          if grep -q "release create" /tmp/gh-calls.log; then
            echo "PASS: gh release create was called"
          else
            echo "FAIL: gh release create was not called"
            exit 1
          fi
          if grep -q "test-explicit-tag-v1.2.3" /tmp/gh-calls.log; then
            echo "PASS: correct explicit tag was used"
          else
            echo "FAIL: expected tag 'test-explicit-tag-v1.2.3' not found in gh call"
            exit 1
          fi
          if grep -q "Test Explicit Tag Release" /tmp/gh-calls.log; then
            echo "PASS: correct title was used"
          else
            echo "FAIL: expected title 'Test Explicit Tag Release' not found in gh call"
            exit 1
          fi
          if grep -q -- "--generate-notes" /tmp/gh-calls.log; then
            echo "PASS: --generate-notes flag was included"
          else
            echo "FAIL: --generate-notes flag was not found in gh call"
            exit 1
          fi
