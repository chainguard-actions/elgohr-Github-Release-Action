name: Test prerelease flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'EOF'
          #!/usr/bin/env bash
          echo "$@" > /tmp/gh-args
          exit 0
          EOF
          chmod +x /tmp/mock-bin/gh

      - name: Add mock to PATH
        run: echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          title: "My Prerelease"
          tag: "v2.0.0-beta"
          prerelease: "true"
        env:
          GH_TOKEN: fake-token-for-testing

      - name: Assert gh was called with --prerelease flag
        run: |
          if [ ! -f /tmp/gh-args ]; then
            echo "FAIL: gh was never called (mock args file not found)"
            exit 1
          fi
          ARGS=$(cat /tmp/gh-args)
          echo "gh called with: $ARGS"
          if echo "$ARGS" | grep -q "\-\-prerelease"; then
            echo "PASS: --prerelease flag was passed"
          else
            echo "FAIL: expected '--prerelease' in gh arguments, got: $ARGS"
            exit 1
          fi
          if echo "$ARGS" | grep -q "release create v2.0.0-beta"; then
            echo "PASS: tag v2.0.0-beta was used"
          else
            echo "FAIL: expected 'release create v2.0.0-beta' in gh arguments"
            exit 1
          fi
