name: Test prerelease creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'EOF'
          #!/bin/sh
          echo "gh $*" >> /tmp/gh-calls.log
          exit 0
          EOF
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          title: "My Prerelease"
          tag: "v2.0.0-beta"
          prerelease: "true"

      - name: Assert gh release create was called with --prerelease flag
        run: |
          echo "gh calls log:"
          cat /tmp/gh-calls.log || echo "(empty)"
          if ! grep -q "release create v2.0.0-beta" /tmp/gh-calls.log; then
            echo "FAIL: expected 'gh release create v2.0.0-beta' in calls"
            exit 1
          fi
          if ! grep -q "\-\-prerelease" /tmp/gh-calls.log; then
            echo "FAIL: expected '--prerelease' flag in calls"
            exit 1
          fi
          echo "PASS"
