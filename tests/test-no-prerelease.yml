name: Test no prerelease flag when prerelease is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'EOF'
          #!/bin/sh
          echo "gh $*" >> /tmp/gh-calls.log
          exit 0
          EOF
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          title: "Stable Release"
          tag: "v3.0.0"
          prerelease: "false"

      - name: Assert --prerelease flag is NOT present
        run: |
          echo "gh calls log:"
          cat /tmp/gh-calls.log || echo "(empty)"
          if ! grep -q "release create v3.0.0" /tmp/gh-calls.log; then
            echo "FAIL: expected 'gh release create v3.0.0' in calls"
            exit 1
          fi
          if grep -q "\-\-prerelease" /tmp/gh-calls.log; then
            echo "FAIL: '--prerelease' flag should NOT be present when prerelease=false"
            exit 1
          fi
          if ! grep -q "\-\-generate-notes" /tmp/gh-calls.log; then
            echo "FAIL: expected '--generate-notes' in calls"
            exit 1
          fi
          echo "PASS"
