name: Test prerelease false does not add flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'EOF'
          #!/bin/sh
          echo "gh $*" >> /tmp/gh-calls.log
          exit 0
          EOF
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - name: Run action with prerelease=false
        uses: .
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          title: "Stable Release"
          tag: "v3.0.0"
          prerelease: "false"

      - name: Assert gh release create was called without --prerelease
        run: |
          echo "gh calls log:"
          cat /tmp/gh-calls.log || echo "(empty)"
          if grep -q "\-\-prerelease" /tmp/gh-calls.log; then
            echo "FAIL: '--prerelease' flag should NOT be present when prerelease=false"
            cat /tmp/gh-calls.log
            exit 1
          fi
          if ! grep -q "release create v3.0.0 -t Stable Release --generate-notes" /tmp/gh-calls.log; then
            echo "FAIL: expected 'gh release create v3.0.0 -t Stable Release --generate-notes' in calls"
            cat /tmp/gh-calls.log
            exit 1
          fi
          echo "PASS"
