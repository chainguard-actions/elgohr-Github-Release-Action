name: Test release with custom workdir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh CLI
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/gh << 'EOF'
          #!/bin/sh
          echo "gh $*" > /tmp/gh-called-args
          # Record the working directory when gh was called
          pwd > /tmp/gh-called-pwd
          exit 0
          EOF
          chmod +x /tmp/fake-bin/gh

      - name: Create workdir
        run: mkdir -p /tmp/test-workdir

      - id: action
        uses: .
        env:
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          title: "Workdir Release"
          tag: "v2.0.0"
          workdir: "/tmp/test-workdir"

      - name: Assert gh was called with correct tag and title
        run: |
          echo "gh args: $(cat /tmp/gh-called-args)"
          ARGS="$(cat /tmp/gh-called-args)"
          if echo "$ARGS" | grep -q "release create v2.0.0"; then
            echo "PASS: gh release create called with correct tag"
          else
            echo "FAIL: expected 'release create v2.0.0' in args, got: $ARGS"
            exit 1
          fi

      - name: Assert gh was called from the workdir
        run: |
          echo "gh pwd: $(cat /tmp/gh-called-pwd)"
          PWD_USED="$(cat /tmp/gh-called-pwd)"
          if [ "$PWD_USED" = "/tmp/test-workdir" ]; then
            echo "PASS: gh was called from the correct workdir"
          else
            echo "FAIL: expected gh to be called from '/tmp/test-workdir', got: $PWD_USED"
            exit 1
          fi
