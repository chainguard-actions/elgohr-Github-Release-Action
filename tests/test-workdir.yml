name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock gh binary that records working directory
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/gh" << 'EOF'
          #!/usr/bin/env bash
          echo "gh $@" > /tmp/gh_args.txt
          pwd > /tmp/gh_workdir.txt
          exit 0
          EOF
          chmod +x "$HOME/bin/gh"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create a subdirectory to use as workdir
        run: |
          mkdir -p /tmp/myrepo

      - id: action
        uses: .
        with:
          title: "Workdir Release"
          tag: "v0.1.0"
          workdir: "/tmp/myrepo"

      - name: Assert gh was called with release create
        run: |
          echo "gh args: $(cat /tmp/gh_args.txt)"
          if ! grep -q "release create" /tmp/gh_args.txt; then
            echo "FAIL: expected 'release create' in gh args"
            exit 1
          fi
          echo "PASS: gh release create was called"

      - name: Assert gh was called from the correct workdir
        run: |
          ACTUAL_WORKDIR=$(cat /tmp/gh_workdir.txt)
          echo "actual workdir: $ACTUAL_WORKDIR"
          if [ "$ACTUAL_WORKDIR" != "/tmp/myrepo" ]; then
            echo "FAIL: expected workdir '/tmp/myrepo', got '$ACTUAL_WORKDIR'"
            exit 1
          fi
          echo "PASS: gh was called from the correct workdir"
