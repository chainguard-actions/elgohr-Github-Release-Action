
name: Release
on: 
  push:
    branches: [ main ]
    tags-ignore:
      - '*'

permissions: {}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - run: make test
  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Create a Release
      uses: elgohr/Github-Release-Action@c552071f9147ab82a7ddbc90651a8d81d24e2085 # main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        title: ${{ github.sha }}
    - name: Create a tagged Release
      uses: elgohr/Github-Release-Action@c552071f9147ab82a7ddbc90651a8d81d24e2085 # main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        title: ${{ github.sha }}
        tag: ${{ github.run_id }}
  release:
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }} # for pushing to protected branch
      - name: Publish new version
        run: |
          git config --global user.email "no_reply@gohr.digital"
          git config --global user.name "Release Bot"
          git tag -fa v5 -m "Update v5 tag"
          git push origin v5 --force
